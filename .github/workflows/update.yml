name: Update repo.json

# Reconstruit le repo.json commun à partir du repo.json de chaque plugin.
# Rien n'est à changer dans les dépôts des plugins : ce workflow va lire ce qu'ils publient.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-repo-json
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Merge plugin manifests
      run: python3 merge.py

    - name: Commit changes
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add repo.json
        if ! git diff --cached --quiet; then
          git commit -m "Update repo.json"
          git push origin main
          exit 0
        fi

        # GitHub coupe les tâches planifiées après 60 jours sans activité sur le dépôt.
        # Sans ce commit, les mises à jour cesseraient d'arriver après une longue pause.
        last_commit=$(git log -1 --format=%ct)
        if [ $(( $(date +%s) - last_commit )) -gt $(( 50 * 86400 )) ]; then
          git commit --allow-empty -m "Keep scheduled workflow active"
          git push origin main
        fi
